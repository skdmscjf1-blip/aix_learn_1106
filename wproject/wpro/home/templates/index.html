<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function predictBtn(){
            $.ajax({
                url : '/home/ajax_data/',
                type : 'post',
                headers : {'X-CSRFToken':'{{csrf_token}}'},
                data : {},
                dataType : 'json',
                success:function(data){
                    alert('성공')
                    console.log(data);
                },
                error:function(){
                    alert('실패');
                }
            });//ajax
        }//predictBtn()
    </script>
</head>
<body>
    <h2>메인페이지</h2>
    <div>
        <label>길이,높이,넓이를 입력하세요</label><br>
        <input type="text" name="data" id="data" placeholder="예.40.0,11.73,7.22 ">
        <button type="button" onclick=predictBtn()>예측</button>
        <br>
        <br>
        <div id="result">입력데이터 : {{result}} </div>
        <div id="result2">예측무게 : {{result2}} g</div>
    </div>
</body>
</html>
